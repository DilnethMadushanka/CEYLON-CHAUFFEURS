<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceylon Chauffeurs | Page Redirection</title>
  <script>
    (function() {
      var path = window.location.pathname.toLowerCase();
      if (path.endsWith('/admin') || path.endsWith('/admin/')) {
        var target = path.endsWith('/') ? path : path + '/';
        window.location.replace(window.location.origin + target + window.location.search);
      } else {
        window.location.replace('index.html');
      }
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0b0b0a; color: #f1efe9;">
  <div style="text-align: center; padding: 24px;">
    <h2 style="color: #f1efe9; margin-bottom: 8px; letter-spacing: -0.02em;">Ceylon Chauffeurs Concierge</h2>
    <p style="color: #9c998f;">Redirecting to your requested page...</p>
    <a href="admin/" style="color: #e3a35f; text-decoration: underline; font-size: 0.9rem;">Go to Admin Portal</a>
  </div>
</body>
</html>
